<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLM 夜班 · 队列</title>
  <link rel="icon" href="data:,"><!-- 空 data 图标：避免浏览器请求 /favicon.ico 打出 404 -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="page-header">
    <h1>GLM 夜班</h1>
  </header>
  <div id="nav"></div>
  <main>
    <!-- 操作（取消/重试）失败的错误条 -->
    <div id="page-error" class="error" hidden></div>

    <!-- 状态条：高峰/非高峰 · 5 小时额度百分比 · 运行中数量 + 手动暂停/恢复按钮（queue.js 渲染） -->
    <div id="statusbar" class="statusbar"></div>

    <!-- 状态条附近的两个入口（#50）：面板只在 HTML 里建这一次，轮询刷新不重建，
         正在填的仓库/标签不会被冲掉（与 #add-form 同一套约定）。 -->
    <div class="board-actions">
      <button type="button" id="import-toggle">从 GitHub 导入</button>
      <button type="button" id="cleanup-toggle">清理磁盘</button>
    </div>

    <!-- 从 GitHub 导入（#50）：填仓库/可选标签/难度，先预览（dry-run），确认后才真正入队。
         独立于 #add-form，互不影响。 -->
    <form id="import-panel" class="card" hidden>
      <h2>从 GitHub 导入</h2>
      <div class="form-grid">
        <label class="field">
          <span class="field-label">仓库 <b class="req">*</b></span>
          <input name="repo" id="i-repo" required placeholder="owner/name">
        </label>
        <label class="field">
          <span class="field-label">标签（可选）</span>
          <input name="label" id="i-label" placeholder="如 night-shift">
        </label>
        <label class="field">
          <span class="field-label">难度</span>
          <select name="difficulty" id="i-difficulty">
            <option value="easy">easy</option>
            <option value="medium" selected>medium</option>
            <option value="hard">hard</option>
          </select>
        </label>
        <!-- #76：导入哪一状态的 issue。缺省第一项「未关闭」（open），与命令行缺省一致。 -->
        <label class="field">
          <span class="field-label">状态</span>
          <select name="state" id="i-state">
            <option value="open" selected>未关闭</option>
            <option value="closed">已关闭</option>
            <option value="all">全部</option>
          </select>
        </label>
      </div>
      <div class="form-actions">
        <button type="submit" class="primary" id="i-preview">预览</button>
        <button type="button" id="i-confirm" hidden>确认导入</button>
        <button type="button" id="i-cancel">收起</button>
        <div id="import-error" class="error" hidden></div>
      </div>
      <div id="import-result" class="panel-result" hidden></div>
    </form>

    <!-- 清理磁盘（#50）：默认先预览将删除的路径，确认后才删；有的没删掉时页面错误条提示。 -->
    <div id="cleanup-panel" class="card" hidden>
      <h2>清理磁盘</h2>
      <p class="panel-note">删除已结束任务（成功/失败/已取消）的 worktree 与过期日志；排队和运行中的不动，任务记录与 repos/ 缓存保留。</p>
      <div class="form-actions">
        <button type="button" class="primary" id="c-preview">预览</button>
        <button type="button" id="c-confirm" hidden>确认删除</button>
        <button type="button" id="c-cancel">收起</button>
      </div>
      <div id="cleanup-result" class="panel-result" hidden></div>
    </div>

    <!-- 三个标签（含数量）与当前标签的任务表；表格上方是仓库筛选（#50，只在浏览器里过滤） -->
    <div id="tabs" class="tabs" role="tablist"></div>
    <div class="table-tools">
      <label class="inline-field">仓库
        <select id="repo-filter"></select>
      </label>
    </div>
    <div id="task-table"></div>

    <!-- 新增任务表单：模板下拉与变量输入、依赖多选由 queue.js 动态填充；
         轮询刷新只重绘上面的区域，不重建表单，正在填写的内容不受影响。
         编辑排队中的任务（#46）也复用这张表单：queue.js 切标题/按钮文案并提交 PATCH。 -->
    <form id="add-form" class="card">
      <h2 id="form-heading">新增任务</h2>
      <div class="form-grid">
        <label class="field">
          <span class="field-label">仓库 <b class="req">*</b></span>
          <input name="repo" id="f-repo" required placeholder="owner/name">
          <div class="field-error" data-error-for="repo" hidden></div>
        </label>
        <label class="field">
          <span class="field-label">模板</span>
          <select name="template" id="f-template">
            <option value="">不用模板</option>
          </select>
          <div class="field-error" data-error-for="template" hidden></div>
        </label>
        <label class="field">
          <span class="field-label">标题</span>
          <input name="title" id="f-title" placeholder="缺省取提示词开头（模板可生成）">
          <div class="field-error" data-error-for="title" hidden></div>
        </label>
        <label class="field">
          <span class="field-label">难度</span>
          <select name="difficulty" id="f-difficulty">
            <option value="easy">easy</option>
            <option value="medium" selected>medium</option>
            <option value="hard">hard</option>
          </select>
          <div class="field-error" data-error-for="difficulty" hidden></div>
        </label>
        <label class="field">
          <span class="field-label">优先级</span>
          <input type="number" step="1" name="priority" id="f-priority" placeholder="0（越大越先领取）">
          <div class="field-error" data-error-for="priority" hidden></div>
        </label>
        <label class="field">
          <span class="field-label">测试命令</span>
          <input name="testCommand" id="f-test" placeholder="如 npm test（可空）">
          <div class="field-error" data-error-for="testCommand" hidden></div>
        </label>
        <label class="field">
          <span class="field-label">最大尝试次数</span>
          <input type="number" min="1" step="1" name="maxAttempts" id="f-max-attempts" placeholder="缺省取配置">
          <div class="field-error" data-error-for="maxAttempts" hidden></div>
        </label>
        <label class="field field-check">
          <input type="checkbox" name="allowPeak" id="f-allow-peak">
          <span>允许高峰时段运行</span>
        </label>
        <label class="field field-wide" id="prompt-row">
          <span class="field-label">提示词 <b class="req">*</b></span>
          <textarea name="prompt" id="f-prompt" rows="4" required
            placeholder="要做什么（选模板时由模板生成，不用填）"></textarea>
          <div class="field-error" data-error-for="prompt" hidden></div>
        </label>
        <div class="field field-wide" id="template-vars-field" hidden>
          <span class="field-label">模板变量</span>
          <div id="template-vars" class="vars-box"></div>
          <div class="field-error" data-error-for="vars" hidden></div>
        </div>
        <label class="field field-wide">
          <span class="field-label">依赖（可多选：这些排队中/运行中的任务全部成功后才会运行）</span>
          <select name="dependsOn" id="f-depends" multiple size="5"></select>
          <div class="field-error" data-error-for="dependsOn" hidden></div>
        </label>
      </div>
      <div class="form-actions">
        <button type="submit" class="primary" id="form-submit">新增任务</button>
        <button type="button" id="cancel-edit" hidden>取消编辑</button>
        <div id="form-error" class="error" hidden></div>
      </div>
    </form>
  </main>
  <script type="module" src="/queue.js"></script>
</body>
</html>
